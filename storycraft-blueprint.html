<title>StoryCraft Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#EEF0F3; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#14161A; --muted:#666C76;
  --line:#DDE0E5; --warn:#8A4B06; --warn-soft:#FDF3E7; --warn-line:#E7C79A;
  --ok-soft:#E8F6F4; --ok-ink:#0B7B70; --ok-line:#9AD6CF;
  --brand:#E20074; --shadow:0 14px 34px rgba(20,22,26,.13);
  --font:'IBM Plex Sans',"Segoe UI",Arial,sans-serif;
  --font-slide:"TeleNeo Office","TeleNeo","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131519; --surface:#1B1E23; --surface-2:#22252B; --ink:#F1F2F4; --muted:#99A0AA;
    --line:#2B2F36; --warn:#F0A742; --warn-soft:#2E2313; --warn-line:#6B4C1E;
    --ok-soft:#0F2723; --ok-ink:#54D6C6; --ok-line:#1F4F49;
    --brand:#FF4B9E; --shadow:0 14px 34px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#131519; --surface:#1B1E23; --surface-2:#22252B; --ink:#F1F2F4; --muted:#99A0AA;
  --line:#2B2F36; --warn:#F0A742; --warn-soft:#2E2313; --warn-line:#6B4C1E;
  --ok-soft:#0F2723; --ok-ink:#54D6C6; --ok-line:#1F4F49;
  --brand:#FF4B9E; --shadow:0 14px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font)}
.wrap{max-width:1220px;margin:0 auto;padding:22px 20px 40px}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--muted)}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;border-radius:100px;padding:6px 13px;border:1px solid var(--ok-line);background:var(--ok-soft);color:var(--ok-ink);cursor:pointer}
.chip.warn{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{font-family:var(--font);font-size:13px;font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:9px;padding:10px 17px;cursor:pointer}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

.main{display:grid;grid-template-columns:196px 1fr;gap:16px;align-items:start}
@media(max-width:840px){.main{grid-template-columns:1fr}}
.nav{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:6px;display:flex;flex-direction:column;gap:1px;max-height:70vh;overflow:auto}
.nav button{display:grid;grid-template-columns:24px 1fr 8px;gap:8px;align-items:center;text-align:left;border:0;background:transparent;color:var(--muted);border-radius:7px;padding:8px;cursor:pointer;font-family:var(--font)}
.nav button:hover{background:var(--surface-2)}
.nav button.active{background:var(--ink);color:var(--paper)}
.nav .n{font-size:10px;opacity:.7;font-variant-numeric:tabular-nums}
.nav .t{font-size:11.5px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nav .f{width:6px;height:6px;border-radius:50%;background:transparent}
.nav .f.warn{background:var(--warn)}

.frame{position:relative;width:100%;aspect-ratio:13.3333/7.5;background:#fff;border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.obj{position:absolute;font-family:var(--font-slide);white-space:pre-wrap;overflow:hidden}
.obj.icon svg,.obj.img img{width:100%;height:100%;display:block}
.obj.img img{object-fit:contain;object-position:right center}
.stagefoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--muted)}
.stagefoot .grow{flex:1}
.navbtn{font-family:var(--font);font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 11px;cursor:pointer}

.qa{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 15px}
.qa[hidden]{display:none}
.qa h4{margin:0 0 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.qa-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.qa-row:first-of-type{border-top:none;padding-top:0}
.qa-badge{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;flex:none;margin-top:1px;font-variant-numeric:tabular-nums}
.qa-badge.pass{background:var(--ok-soft);color:var(--ok-ink);border:1px solid var(--ok-line)}
.qa-badge.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.qa-text b{display:block;font-size:12px;font-weight:600}
.qa-text span{font-size:11px;color:var(--muted);line-height:1.4}

.settings{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px 17px}
.settings h4{margin:0 0 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.srow{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
@media(max-width:760px){.srow{grid-template-columns:1fr}}
.logobox{display:flex;flex-direction:column;gap:8px}
.logoprev{height:56px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;background:var(--surface-2);overflow:hidden}
.logoprev img{max-width:90%;max-height:44px;object-fit:contain}
.logoprev span{font-size:11px;color:var(--muted)}
.logoacts{display:flex;gap:7px}
.filebtn{font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:7px;padding:6px 11px;cursor:pointer}
.filebtn input{display:none}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:620px){.fields{grid-template-columns:1fr}}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
input[type=text]{font-family:var(--font);font-size:12.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
input[type=text]:focus{outline:2px solid var(--brand);outline-offset:1px}
.opts{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--brand)}
.foot{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.6}
.status{font-size:11.5px;color:var(--muted)}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1 id="deckTitle">StoryCraft</h1>
      <div class="sub" id="deckSub">—</div>
    </div>
    <div class="grow"></div>
    <button class="chip" id="gateChip" aria-expanded="false"><span class="d"></span><span id="gateText">Prüfe…</span></button>
    <button class="btn" id="exportBtn" disabled>PowerPoint exportieren</button>
  </div>

  <div class="main">
    <nav class="nav" id="nav"></nav>
    <div>
      <div class="frame" id="frame"></div>
      <div class="stagefoot">
        <button class="navbtn" id="prevBtn">←</button>
        <button class="navbtn" id="nextBtn">→</button>
        <span id="stageNote">—</span>
        <span class="grow"></span>
        <span class="status" id="exportStatus"></span>
      </div>
      <div class="qa" id="qaPanel" hidden>
        <h4>Prüfung dieser Folie</h4>
        <div id="qaList"></div>
      </div>
    </div>
  </div>

  <div class="settings">
    <h4>Kopf- und Fußzeile</h4>
    <div class="srow">
      <div class="logobox">
        <div class="logoprev" id="logoPrev"><span>Kein Logo</span></div>
        <div class="logoacts">
          <label class="filebtn">Logo wählen<input type="file" id="logoFile" accept="image/png,image/jpeg"></label>
          <button class="filebtn" id="logoClear">Entfernen</button>
        </div>
      </div>
      <div>
        <div class="fields">
          <label class="fl">Fußzeile links<input type="text" id="fLeft" placeholder="intern"></label>
          <label class="fl">Fußzeile mitte<input type="text" id="fMid" placeholder="Bereich"></label>
          <label class="fl">Fußzeile rechts<input type="text" id="fRight" placeholder="Titel der Unterlage"></label>
        </div>
        <div class="opts">
          <label><input type="checkbox" id="optNum" checked> Foliennummern</label>
          <label><input type="checkbox" id="optGrid"> Raster einblenden</label>
          <label class="filebtn" style="margin-left:auto">Anderen Master laden<input type="file" id="masterFile" accept=".pptx,.potx"></label>
        </div>
      </div>
    </div>
  </div>

  <p class="foot" id="footNote">—</p>
</div>

<script>
/* === ENGINE (identisch mit der getesteten Node-Version) === */
/* StoryCraft Engine — shared by the browser tool and the Node test harness.
   Grid + templates + icons + OOXML slide generation + master injection. */
(function(root){
"use strict";

// ---------- canvas + grid (values read off the corporate master) ----------
var G = {
  W: 13.3333, H: 7.5,
  MARGIN: 0.52, GUTTER: 0.31, COLS: 12,
  TITLE: { x:0.52, y:0.44, w:12.28, h:0.79 },
  CONTENT_TOP: 1.62, CONTENT_H: 5.36
};
G.CONTENT_BOTTOM = G.CONTENT_TOP + G.CONTENT_H;
G.COLW = (G.W - 2*G.MARGIN - (G.COLS-1)*G.GUTTER) / G.COLS;
// Safe area as the master defines it: side margins from the content placeholders,
// top from the title, bottom from the footer band.
G.SAFE = { left:G.MARGIN, right:G.W-G.MARGIN, top:0.44, bottom:7.06 };
G.FOOTER = { x:0.524, y:7.062, w:9.135, h:0.354 };
G.SLDNUM = { x:12.533, y:7.062, w:0.276, h:0.354 };
G.LOGO   = { right:12.81, y:0.30, maxH:0.62, maxW:2.2 };
function colX(c){ return G.MARGIN + c*(G.COLW+G.GUTTER); }
function colW(span){ return span*G.COLW + (span-1)*G.GUTTER; }

// ---------- theme defaults (overwritten when a master is loaded) ----------
var DEFAULT_THEME = {
  name: 'Deutsche Telekom – Circle (06/2021)',
  colors: { tx1:'000000', bg1:'FFFFFF', tx2:'E20074', bg2:'A3A3A3',
            accent1:'32B9AF', accent2:'A4DEEE', accent3:'ECCCBF',
            accent4:'F0E68C', accent5:'00A8E6', accent6:'6E648C' },
  fonts: { major:'TeleNeo Office ExtraBold', minor:'TeleNeo Office' }
};

// Palette roles used by the templates. Each entry is a THEME ROLE, so the
// exported XML can reference the master's theme instead of a frozen hex.
function mixWhite(hex, w){
  var n = parseInt(hex,16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  function m(c){ return Math.round(c*(1-w) + 255*w); }
  return ((1<<24) + (m(r)<<16) + (m(g)<<8) + m(b)).toString(16).slice(1).toUpperCase();
}
function darken(hex, f){
  var n = parseInt(hex,16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return ((1<<24) + (Math.round(r*f)<<16) + (Math.round(g*f)<<8) + Math.round(b*f)).toString(16).slice(1).toUpperCase();
}
// Every role maps to the master's theme where one exists, so a master update
// pulls the deck along. Tints and text-safe variants are derived, not frozen.
function paletteFor(theme){
  var c = theme.colors;
  return {
    ink:            { role:'tx1',     hex:c.tx1 },
    onAccent:       { role:'bg1',     hex:c.bg1 },
    accent:         { role:'tx2',     hex:c.tx2 },
    accentDark:     { role:null,      hex:darken(c.tx2, 0.82) },
    accent2:        { role:'accent1', hex:c.accent1 },
    accent2Dark:    { role:null,      hex:darken(c.accent1, 0.55) },
    soft:           { role:null,      hex:'4B525C' },
    line:           { role:null,      hex:'D9DCE0' },
    surface:        { role:null,      hex:'F5F6F7' },
    surfaceAccent:  { role:null,      hex:mixWhite(c.tx2, 0.94) },
    surfaceAccent2: { role:null,      hex:mixWhite(c.accent1, 0.90) },
    accentLine:     { role:null,      hex:mixWhite(c.tx2, 0.72) },
    accent2Line:    { role:null,      hex:mixWhite(c.accent1, 0.62) }
  };
}

// ---------- icons: one descriptor, three renderers (SVG, OOXML, gate) ----------
var ICONS = {
  check: [ {op:'line',x1:4,y1:12.5,x2:9.5,y2:18}, {op:'line',x1:9.5,y1:18,x2:20,y2:6} ],
  'arrow-right': [ {op:'line',x1:3.5,y1:12,x2:18,y2:12}, {op:'line',x1:12,y1:6,x2:18.5,y2:12}, {op:'line',x1:12,y1:18,x2:18.5,y2:12} ],
  target: [ {op:'circle',cx:12,cy:12,r:8.5}, {op:'circle',cx:12,cy:12,r:5}, {op:'circle',cx:12,cy:12,r:1.6} ],
  'trending-up': [ {op:'line',x1:3,y1:17,x2:9,y2:11}, {op:'line',x1:9,y1:11,x2:13,y2:15}, {op:'line',x1:13,y1:15,x2:21,y2:7}, {op:'line',x1:15,y1:7,x2:21,y2:7}, {op:'line',x1:21,y1:7,x2:21,y2:13} ],
  layers: [ {op:'line',x1:12,y1:3,x2:21,y2:8}, {op:'line',x1:21,y1:8,x2:12,y2:13}, {op:'line',x1:12,y1:13,x2:3,y2:8}, {op:'line',x1:3,y1:8,x2:12,y2:3}, {op:'line',x1:4,y1:12.5,x2:12,y2:17}, {op:'line',x1:12,y1:17,x2:20,y2:12.5}, {op:'line',x1:4,y1:16,x2:12,y2:20.5}, {op:'line',x1:12,y1:20.5,x2:20,y2:16} ],
  users: [ {op:'circle',cx:9,cy:8,r:3.1}, {op:'circle',cx:17,cy:9.4,r:2.5}, {op:'rect',x:3.4,y:13.6,w:11.2,h:7.2,rx:3.6}, {op:'rect',x:14.6,y:14.4,w:7.6,h:5.8,rx:2.9} ]
};
function iconName(n){ return ICONS[n] ? n : 'check'; }
function svgFor(name, hex){
  var inner = (ICONS[name]||ICONS.check).map(function(op){
    if(op.op==='line') return '<line x1="'+op.x1+'" y1="'+op.y1+'" x2="'+op.x2+'" y2="'+op.y2+'"/>';
    if(op.op==='circle') return '<circle cx="'+op.cx+'" cy="'+op.cy+'" r="'+op.r+'"/>';
    if(op.op==='rect') return '<rect x="'+op.x+'" y="'+op.y+'" width="'+op.w+'" height="'+op.h+'" rx="'+(op.rx||0)+'"/>';
    return '';
  }).join('');
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#'+hex+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
}

// ---------- object constructors ----------
function T(id,x,y,w,h,value,fontSize,o){
  o = o||{};
  return { id:id, type:'text', x:x, y:y, w:w, h:h, value:value==null?'':String(value), fontSize:fontSize,
    bold:!!o.bold, color:o.color||{role:'tx1',hex:'000000'}, align:o.align||'left',
    valign:o.valign||'top', leading:o.leading||1.2, mono:!!o.mono, placeholder:o.placeholder||null };
}
function Bx(id,x,y,w,h,o){
  o = o||{};
  return { id:id, type:'box', x:x, y:y, w:w, h:h, fill:o.fill, line:o.line||null,
    lineW:o.lineW||0, radius:o.radius||0, peerGroup:o.peerGroup||null, decor:!!o.decor };
}
function Ic(id,name,x,y,size,color){ return { id:id, type:'icon', name:iconName(name), x:x, y:y, w:size, h:size, color:color }; }

// ---------- templates: content in, objects out ----------
// One deterministic title fit, used identically by preview and export.
// This replaces the four measuring engines of v58 that raced each other.
var TITLE_LEADING = 1.12;
function fitTitleSize(text, widthIn, maxHeightIn){
  var sizes = [40,36,32,28,26,24], s = String(text||'');
  for(var i=0;i<sizes.length;i++){
    var fs = sizes[i];
    var perLine = Math.floor(widthIn*72 / (fs*0.52));
    var lines = Math.max(1, Math.ceil(s.length / Math.max(perLine,1)));
    var h = lines * fs * TITLE_LEADING / 72;
    if(lines<=2 && h<=maxHeightIn) return { size:fs, lines:lines, h:h };
  }
  return { size:24, lines:2, h:2*24*TITLE_LEADING/72 };
}
// Header block: title placeholder + subtitle. Returns where content may start.
function header(c, P, objs, opts){
  var reserve = (opts && opts.logo) ? logoBox(opts.logo).w + 0.3 : 0;
  var titleW = G.TITLE.w - reserve;
  var f = fitTitleSize(c.title, titleW, 1.02);
  var boxH = Math.max(G.TITLE.h, f.h * 1.10);
  objs.push(T('title', G.TITLE.x, G.TITLE.y, titleW, boxH,
    c.title, f.size, {bold:true, color:P.ink, leading:TITLE_LEADING, placeholder:'title'}));
  var y = G.TITLE.y + boxH + 0.04;
  if(c.subtitle){
    objs.push(T('sub', G.TITLE.x, y, colW(11), 0.40, c.subtitle, 13, {color:P.soft, leading:1.25}));
    y += 0.52;
  }
  return Math.max(G.CONTENT_TOP, y);
}
function noteBar(objs, P, text, top, id){
  if(!text) return top;
  var h = 0.62;
  var y = G.CONTENT_BOTTOM - h;
  objs.push(Bx((id||'note')+'Bg', colX(0), y, colW(12), h, {fill:P.surface, line:P.line, lineW:1, radius:0.1}));
  objs.push(Bx((id||'note')+'Mark', colX(0), y, 0.06, h, {fill:P.accent, decor:true}));
  objs.push(T((id||'note')+'Txt', colX(0)+0.26, y+0.06, colW(12)-0.5, h-0.12, text, 11.5, {color:P.ink, valign:'mid', leading:1.3}));
  return y - 0.24;
}
function toneFill(tone, P){
  if(tone==='accent') return { bg:P.surfaceAccent, line:P.accentLine, ink:P.ink, kicker:P.accentDark, icon:P.accent };
  if(tone==='accent2') return { bg:P.surfaceAccent2, line:P.accent2Line, ink:P.ink, kicker:P.accent2Dark, icon:P.accent2Dark };
  if(tone==='dark') return { bg:P.ink, line:P.ink, ink:P.onAccent, kicker:P.onAccent, icon:P.onAccent };
  return { bg:P.surface, line:P.line, ink:P.ink, kicker:P.soft, icon:P.accent };
}
var STEP_ICONS = ['users','layers','target','check'];

// Logo keeps its aspect ratio inside the reserved corner box.
function logoBox(logo){
  var maxH = G.LOGO.maxH, maxW = G.LOGO.maxW;
  var ratio = (logo.w && logo.h) ? (logo.w/logo.h) : 3;
  var h = maxH, w = h*ratio;
  if(w > maxW){ w = maxW; h = w/ratio; }
  return { x: G.LOGO.right - w, y: G.LOGO.y, w:w, h:h };
}
// Master furniture every slide carries: logo, footer, slide number.
function decorate(scene, P, opts, index, total){
  opts = opts || {};
  if(opts.logo){
    var b = logoBox(opts.logo);
    scene.objs.push({ id:'logo', type:'image', x:b.x, y:b.y, w:b.w, h:b.h, asset:'logo', furniture:true });
  }
  var f = opts.footer || {};
  var parts = [f.left, f.middle, f.right].filter(function(v){ return v && String(v).trim(); });
  if(parts.length){
    scene.objs.push(T('footer', G.FOOTER.x, G.FOOTER.y, G.FOOTER.w, G.FOOTER.h,
      parts.join('     ·     '), 9, {color:P.soft, valign:'mid', placeholder:'ftr'}));
  }
  if(opts.slideNumbers !== false){
    scene.objs.push(T('sldNum', G.SLDNUM.x, G.SLDNUM.y, G.SLDNUM.w, G.SLDNUM.h,
      String(index+1).padStart(2,'0'), 9, {color:P.soft, align:'right', valign:'mid', placeholder:'sldNum'}));
  }
  return scene;
}

var TEMPLATES = {
  cover: {
    label:'Cover', layout:'Leer',
    build:function(c,P,opts){
      var objs = [
        T('eyebrow', colX(0), 1.15, colW(7), 0.3, c.eyebrow, 11.5, {bold:true, color:P.accent}),
        T('title', colX(0), 1.62, colW(7), 1.15, c.title, 54, {bold:true, color:P.ink}),
        Bx('rule', colX(0), 3.02, 0.7, 0.05, {fill:P.accent2}),
        T('lead', colX(0), 3.35, colW(6), 0.9, c.lead, 15, {color:P.ink, leading:1.35}),
        T('meta', colX(0), 4.55, colW(6), 0.3, (c.meta||[]).join('   ·   '), 11.5, {color:P.soft}),
        Bx('panel', colX(7), 1.62, colW(5), 3.52, {fill:P.accent, radius:0.18}),
        Bx('mark', colX(7)+0.45, 2.0, 0.8, 0.8, {fill:P.onAccent, radius:0.16}),
        T('markTxt', colX(7)+0.45, 2.0, 0.8, 0.8, c.panelMark, 22, {bold:true, color:P.accent, align:'center', valign:'mid'}),

// ---------- quality gate (pure geometry, no DOM) ----------
function rectsOverlap(a,b){
  var ox = Math.min(a.x+a.w,b.x+b.w) - Math.max(a.x,b.x);
  var oy = Math.min(a.y+a.h,b.y+b.h) - Math.max(a.y,b.y);
  return (ox>0 && oy>0) ? ox*oy : 0;
}
function relLum(hex){
  hex = String(hex).replace('#','');
  var n = parseInt(hex,16), rgb = [(n>>16)&255,(n>>8)&255,n&255];
  function f(c){ c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
  return 0.2126*f(rgb[0]) + 0.7152*f(rgb[1]) + 0.0722*f(rgb[2]);
}
function contrastRatio(h1,h2){
  var l1=relLum(h1), l2=relLum(h2), a=Math.max(l1,l2), b=Math.min(l1,l2);
  return (a+0.05)/(b+0.05);
}
function computeGate(scene){
  var rows = [], objs = scene.objs;
  var boxes = objs.filter(function(o){ return o.type==='box'; });
  var texts = objs.filter(function(o){ return o.type==='text'; });

  var worst = 0;
  objs.filter(function(o){ return o.type!=='icon' && !o.placeholder && !o.furniture; }).forEach(function(o){
    var over = Math.max(0, (o.x+o.w)-G.SAFE.right, G.SAFE.left-o.x, (o.y+o.h)-G.SAFE.bottom, G.SAFE.top-o.y);
    if(over>worst) worst = over;
  });
  objs.filter(function(o){ return o.furniture; }).forEach(function(o){
    var over = Math.max(0, (o.x+o.w)-(G.W-0.1), 0.1-o.x, (o.y+o.h)-(G.H-0.1), 0.1-o.y);
    if(over>worst) worst = over;
  });
  rows.push(worst>0.01
    ? {status:'warn', title:'Satzspiegel verletzt', detail:'Ein Element verlässt den Master-Satzspiegel um Δ '+worst.toFixed(2)+'".'}
    : {status:'pass', title:'Satzspiegel eingehalten', detail:'Alles bleibt im Satzspiegel des Unternehmensmasters.'});

  // Containment is intentional design (badge on a card, track behind nodes);
  // only partial overlaps of sibling shapes are a defect.
  function contains(a,b){
    return a.x<=b.x+0.01 && a.y<=b.y+0.01 && a.x+a.w>=b.x+b.w-0.01 && a.y+a.h>=b.y+b.h-0.01;
  }
  // Texts count too: a rule struck through a headline is the defect that
  // box-vs-box checking never sees.
  var collidable = objs.filter(function(o){
    return (o.type==='box' || o.type==='text') && !o.decor && !o.placeholder;
  });
  var maxOv = 0;
  for(var i=0;i<collidable.length;i++) for(var j=i+1;j<collidable.length;j++){
    var A = collidable[i], B = collidable[j];
    if(contains(A,B) || contains(B,A)) continue;
    var ov = rectsOverlap(A,B);
    if(ov>maxOv) maxOv = ov;
  }
  rows.push(maxOv>0.005
    ? {status:'warn', title:'Überlappung erkannt', detail:'Zwei Flächen überschneiden sich um Δ '+maxOv.toFixed(2)+' in².'}
    : {status:'pass', title:'Keine Überlappung', detail:'Flächen berühren sich höchstens an der Kante.'});

  var groups = {}, alignWarn = null;
  boxes.forEach(function(o){ if(o.peerGroup){ (groups[o.peerGroup]=groups[o.peerGroup]||[]).push(o); } });
  Object.keys(groups).forEach(function(g){
    var arr=groups[g];
    if(arr.length<2) return;
    function spread(f){ var v=arr.map(f); return Math.max.apply(null,v)-Math.min.apply(null,v); }
    // A row of peers must share top and height; a stacked column must share
    // left and width. Pick the axis the group is actually laid out along.
    var isRow = spread(function(o){return o.x;}) > spread(function(o){return o.y;});
    var d1 = isRow ? spread(function(o){return o.y;}) : spread(function(o){return o.x;});
    var d2 = isRow ? spread(function(o){return o.h;}) : spread(function(o){return o.w;});
    if(d1>0.01||d2>0.01) alignWarn={dy:d1,dh:d2,axis:isRow?'Reihe':'Spalte'};
  });
  rows.push(alignWarn
    ? {status:'warn', title:'Peers nicht bündig', detail:alignWarn.axis+': Kanten Δ '+alignWarn.dy.toFixed(2)+'", Maße Δ '+alignWarn.dh.toFixed(2)+'".'}
    : {status:'pass', title:'Peers schließen bündig ab', detail:'Gleiche Oberkante und Höhe je Gruppe.'});

  var worstRatio = 99;
  texts.forEach(function(t){
    var bg = 'FFFFFF';
    boxes.forEach(function(b){
      if(t.x>=b.x-0.01 && t.y>=b.y-0.01 && (t.x+t.w)<=(b.x+b.w+0.01) && (t.y+t.h)<=(b.y+b.h+0.01)) bg = b.fill.hex;
    });
    var ratio = contrastRatio(t.color.hex, bg);
    var large = t.fontSize>=18 || (t.bold && t.fontSize>=14);
    if(ratio < (large?3:4.5) && ratio<worstRatio) worstRatio = ratio;
  });
  rows.push(worstRatio<99
    ? {status:'warn', title:'Kontrast zu niedrig', detail:'Schwächster Text erreicht nur '+worstRatio.toFixed(1)+':1 (nötig 4,5:1).'}
    : {status:'pass', title:'Kontrast ausreichend', detail:'Alle Textfarben erreichen den WCAG-Mindestwert.'});

  return rows;
}

// ---------- OOXML generation ----------
var EMU = 914400;
function emu(inch){ return Math.round(inch*EMU); }
function xesc(s){

    .replace(/"/g,'&quot;').replace(/\r/g,'');
}
// A color is {role, hex}: prefer the master's theme role so the deck follows
// the corporate theme; fall back to a literal hex when there is no role.
function fillClr(c){
  if(c && c.role) return '<a:schemeClr val="'+c.role+'"/>';
  return '<a:srgbClr val="'+((c&&c.hex)||'000000')+'"/>';
}
function xfrm(o){
  return '<a:xfrm><a:off x="'+emu(o.x)+'" y="'+emu(o.y)+'"/><a:ext cx="'+emu(Math.max(o.w,0.01))+'" cy="'+emu(Math.max(o.h,0.01))+'"/></a:xfrm>';
}
function geomFor(o){
  if(o.radius && o.radius>0){
    var adj = Math.round(Math.min(0.5, o.radius/Math.min(o.w,o.h))*100000);
    return '<a:prstGeom prst="roundRect"><a:avLst><a:gd name="adj" fmla="val '+adj+'"/></a:avLst></a:prstGeom>';
  }
  return '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom>';
}
function boxXml(o,id){
  var ln = o.lineW ? '<a:ln w="'+Math.round(o.lineW*12700)+'"><a:solidFill>'+fillClr(o.line||o.fill)+'</a:solidFill></a:ln>' : '<a:ln><a:noFill/></a:ln>';
  return '<p:sp><p:nvSpPr><p:cNvPr id="'+id+'" name="'+xesc(o.id||('Form '+id))+'"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>'
    + '<p:spPr>'+xfrm(o)+geomFor(o)+'<a:solidFill>'+fillClr(o.fill)+'</a:solidFill>'+ln+'</p:spPr>'
    + '<p:txBody><a:bodyPr/><a:lstStyle/><a:p><a:endParaRPr lang="de-DE"/></a:p></p:txBody></p:sp>';
}
function runsXml(o){
  var lines = String(o.value==null?'':o.value).split('\n');
  var algn = o.align==='center' ? 'ctr' : (o.align==='right' ? 'r' : 'l');
  return lines.map(function(line){
    var pPr = '<a:pPr algn="'+algn+'"><a:lnSpc><a:spcPct val="'+Math.round((o.leading||1.2)*100000)+'"/></a:lnSpc></a:pPr>';
    if(line === '') return '<a:p>'+pPr+'<a:endParaRPr lang="de-DE" sz="'+Math.round(o.fontSize*100)+'"/></a:p>';
    return '<a:p>'+pPr+'<a:r><a:rPr lang="de-DE" sz="'+Math.round(o.fontSize*100)+'" b="'+(o.bold?1:0)+'" dirty="0">'
      + '<a:solidFill>'+fillClr(o.color)+'</a:solidFill>'
      + '<a:latin typeface="'+(o.bold?'+mj-lt':'+mn-lt')+'"/></a:rPr>'
      + '<a:t xml:space="preserve">'+xesc(line)+'</a:t></a:r></a:p>';

}
function textXml(o,id){
  var anchor = o.valign==='mid' ? 'ctr' : 't';
  // A title marked as placeholder inherits position and styling from the layout,
  // so it stays a real PowerPoint title (outline, master-driven formatting).
  if(o.placeholder === 'ftr' || o.placeholder === 'sldNum'){
    var idx = (o.phIdx===undefined||o.phIdx===null) ? '' : ' idx="'+o.phIdx+'"';
    var body = o.placeholder === 'sldNum'
      ? '<a:fld id="{B4B4C0A1-7E1F-4A6E-9C3D-00000000'+String(id).padStart(4,'0')+'}" type="slidenum">'
        + '<a:rPr lang="de-DE"/><a:t>'+xesc(o.value||'')+'</a:t></a:fld><a:endParaRPr lang="de-DE"/>'
      : '<a:r><a:rPr lang="de-DE" dirty="0"/><a:t xml:space="preserve">'+xesc(o.value||'')+'</a:t></a:r>';
    return '<p:sp><p:nvSpPr><p:cNvPr id="'+id+'" name="'+(o.placeholder==='ftr'?'Fußzeile':'Foliennummer')+' '+id+'"/>'
      + '<p:cNvSpPr><a:spLocks noGrp="1"/></p:cNvSpPr>'
      + '<p:nvPr><p:ph type="'+o.placeholder+'" sz="quarter"'+idx+'/></p:nvPr></p:nvSpPr>'
      + '<p:spPr/><p:txBody><a:bodyPr/><a:lstStyle/><a:p>'+body+'</a:p></p:txBody></p:sp>';
  }
  if(o.placeholder === 'title'){
    return '<p:sp><p:nvSpPr><p:cNvPr id="'+id+'" name="Titel '+id+'"/>'
      + '<p:cNvSpPr><a:spLocks noGrp="1"/></p:cNvSpPr><p:nvPr><p:ph type="title"/></p:nvPr></p:nvSpPr>'
      + '<p:spPr>'+xfrm(o)+'</p:spPr>'
      + '<p:txBody><a:bodyPr wrap="square" lIns="0" tIns="0" rIns="0" bIns="0" anchor="t"><a:noAutofit/></a:bodyPr><a:lstStyle/>'
      + String(o.value).split('\n').map(function(line){
          return '<a:p><a:pPr algn="l"><a:lnSpc><a:spcPct val="'+Math.round((o.leading||1.2)*100000)+'"/></a:lnSpc></a:pPr>'
            + '<a:r><a:rPr lang="de-DE" sz="'+Math.round(o.fontSize*100)+'" b="1" dirty="0"/>'
            + '<a:t xml:space="preserve">'+xesc(line)+'</a:t></a:r></a:p>';
        }).join('')
      + '</p:txBody></p:sp>';
  }
  return '<p:sp><p:nvSpPr><p:cNvPr id="'+id+'" name="'+xesc(o.id||('Text '+id))+'"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr>'
    + '<p:spPr>'+xfrm(o)+'<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr>'
    + '<p:txBody><a:bodyPr wrap="square" lIns="0" tIns="0" rIns="0" bIns="0" anchor="'+anchor+'"><a:noAutofit/></a:bodyPr>'
    + '<a:lstStyle/>'+runsXml(o)+'</p:txBody></p:sp>';
}
function strokeShape(id,name,x,y,w,h,geom,color,flipV){
  return '<p:sp><p:nvSpPr><p:cNvPr id="'+id+'" name="'+xesc(name)+'"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>'
    + '<p:spPr><a:xfrm'+(flipV?' flipV="1"':'')+'><a:off x="'+emu(x)+'" y="'+emu(y)+'"/><a:ext cx="'+emu(Math.max(w,0.008))+'" cy="'+emu(Math.max(h,0.008))+'"/></a:xfrm>'
    + geom + '<a:noFill/>'
    + '<a:ln w="19050" cap="rnd"><a:solidFill>'+fillClr(color)+'</a:solidFill><a:round/></a:ln></p:spPr>'
    + '<p:txBody><a:bodyPr/><a:lstStyle/><a:p><a:endParaRPr lang="de-DE"/></a:p></p:txBody></p:sp>';
}
function iconXml(o, startId){
  var ops = ICONS[o.name]||ICONS.check, s = o.w/24, out = [], id = startId;
  ops.forEach(function(op,k){
    if(op.op==='line'){
      var X1=o.x+op.x1*s, Y1=o.y+op.y1*s, X2=o.x+op.x2*s, Y2=o.y+op.y2*s;
      out.push(strokeShape(id++, o.name+'-l'+k, Math.min(X1,X2), Math.min(Y1,Y2),
        Math.abs(X2-X1), Math.abs(Y2-Y1),
        '<a:prstGeom prst="line"><a:avLst/></a:prstGeom>', o.color, (Y2<Y1)!==(X2<X1) ? true : false));
    } else if(op.op==='circle'){
      var cx=o.x+op.cx*s, cy=o.y+op.cy*s, r=op.r*s;
      out.push(strokeShape(id++, o.name+'-c'+k, cx-r, cy-r, r*2, r*2,
        '<a:prstGeom prst="ellipse"><a:avLst/></a:prstGeom>', o.color, false));
    } else if(op.op==='rect'){
      var rw=op.w*s, rh=op.h*s;
      var adj = op.rx ? Math.round(Math.min(0.5, (op.rx*s)/Math.min(rw,rh))*100000) : 0;
      var geom = op.rx
        ? '<a:prstGeom prst="roundRect"><a:avLst><a:gd name="adj" fmla="val '+adj+'"/></a:avLst></a:prstGeom>'
        : '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom>';
      out.push(strokeShape(id++, o.name+'-r'+k, o.x+op.x*s, o.y+op.y*s, rw, rh, geom, o.color, false));
    }
  });
  // One group per icon, so it moves and scales as a single object in PowerPoint.
  var gx = emu(o.x), gy = emu(o.y), gw = emu(o.w), gh = emu(o.h);
  var xml = '<p:grpSp><p:nvGrpSpPr><p:cNvPr id="'+(id++)+'" name="Piktogramm '+xesc(o.name)+'"/>'
    + '<p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>'
    + '<p:grpSpPr><a:xfrm><a:off x="'+gx+'" y="'+gy+'"/><a:ext cx="'+gw+'" cy="'+gh+'"/>'
    + '<a:chOff x="'+gx+'" y="'+gy+'"/><a:chExt cx="'+gw+'" cy="'+gh+'"/></a:xfrm></p:grpSpPr>'
    + out.join('') + '</p:grpSp>';

}
function imageXml(o, id, relId){
  return '<p:pic><p:nvPicPr><p:cNvPr id="'+id+'" name="'+xesc(o.id||'Bild')+'"/>'
    + '<p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr>'
    + '<p:blipFill><a:blip r:embed="'+relId+'"/><a:stretch><a:fillRect/></a:stretch></p:blipFill>'
    + '<p:spPr>'+xfrm(o)+'<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>';
}
function buildSlideXml(scene){
  var id = 2, parts = [];
  scene.objs.forEach(function(o){
    if(o.type==='box'){ parts.push(boxXml(o,id++)); }
    else if(o.type==='text'){ parts.push(textXml(o,id++)); }
    else if(o.type==='icon'){ var r = iconXml(o,id); parts.push(r.xml); id = r.nextId; }
    else if(o.type==='image' && scene._assetRel){ parts.push(imageXml(o, id++, scene._assetRel)); }
  });
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"'
    + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"'
    + ' xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">'
    + '<p:cSld><p:spTree>'
    + '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>'
    + '<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>'
    + parts.join('')
    + '</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>';
}

// ---------- master parsing ----------
function parseTheme(themeXml){
  var theme = { name:'', colors:{}, fonts:{} };
  var nm = themeXml.match(/name="([^"]*)"/);
  theme.name = nm ? nm[1] : '';
  var cs = themeXml.match(/<a:clrScheme[\s\S]*?<\/a:clrScheme>/);
  if(cs){
    ['dk1','lt1','dk2','lt2','accent1','accent2','accent3','accent4','accent5','accent6'].forEach(function(role){
      var m = cs[0].match(new RegExp('<a:'+role+'>([\\s\\S]*?)</a:'+role+'>'));
      if(m){
        var c = m[1].match(/(?:srgbClr val="|lastClr=")([0-9A-Fa-f]{6})/);
        if(c) theme.colors[role] = c[1].toUpperCase();
      }
    });
  }
  // slide-context names via the standard colour map
  var c = theme.colors;
  theme.colors = {
    tx1:c.dk1||'000000', bg1:c.lt1||'FFFFFF', tx2:c.dk2||'E20074', bg2:c.lt2||'A3A3A3',
    accent1:c.accent1||'32B9AF', accent2:c.accent2||'A4DEEE', accent3:c.accent3||'ECCCBF',
    accent4:c.accent4||'F0E68C', accent5:c.accent5||'00A8E6', accent6:c.accent6||'6E648C'
  };
  var fs = themeXml.match(/<a:fontScheme[\s\S]*?<\/a:fontScheme>/);
  if(fs){
    var mj = fs[0].match(/<a:majorFont>\s*<a:latin typeface="([^"]*)"/);
    var mn = fs[0].match(/<a:minorFont>\s*<a:latin typeface="([^"]*)"/);
    theme.fonts = { major: mj?mj[1]:'', minor: mn?mn[1]:'' };
  }
  return theme;
}
function parseLayoutName(layoutXml){
  var m = layoutXml.match(/<p:cSld[^>]*name="([^"]*)"/);
  return m ? m[1] : '';
}

// ---------- master injection ----------
// Writes the generated slides into the ORIGINAL master package, so the result
// keeps its theme, all layouts, fonts, footers and slide numbers.
async function injectIntoMaster(JSZip, masterData, scenes, logo){
  var zip = await JSZip.loadAsync(masterData);
  // The logo travels as one media part shared by every slide.
  var logoName = logo ? ('storycraft-logo.'+(logo.ext||'png')) : null;
  var logoRel = 'rId9';
  if(logo){ zip.file('ppt/media/'+logoName, logo.bytes); }

  // map layout name -> part name
  var layouts = {};
  var layoutFiles = Object.keys(zip.files).filter(function(p){ return /^ppt\/slideLayouts\/slideLayout\d+\.xml$/.test(p); });
  for(var i=0;i<layoutFiles.length;i++){
    var lx = await zip.file(layoutFiles[i]).async('string');
    layouts[parseLayoutName(lx)] = layoutFiles[i];
  }

  // drop the master file's own sample slides and their notes
  Object.keys(zip.files).forEach(function(p){
    if(/^ppt\/slides\/slide\d+\.xml$/.test(p) || /^ppt\/slides\/_rels\/slide\d+\.xml\.rels$/.test(p)
       || /^ppt\/notesSlides\//.test(p)) zip.remove(p);
  });

  var ct = await zip.file('[Content_Types].xml').async('string');
  ct = ct.replace(/<Override PartName="\/ppt\/slides\/slide\d+\.xml"[^>]*\/>/g, '')
         .replace(/<Override PartName="\/ppt\/notesSlides\/[^"]*"[^>]*\/>/g, '');

  var prels = await zip.file('ppt/_rels/presentation.xml.rels').async('string');
  prels = prels.replace(/<Relationship[^>]*Target="slides\/slide\d+\.xml"[^>]*\/>/g, '');
  var maxRid = 0;
  prels.replace(/Id="rId(\d+)"/g, function(_,n){ maxRid = Math.max(maxRid, parseInt(n,10)); return _; });

  var sldIds = [], ctAdds = [], relAdds = [];
  for(var s=0;s<scenes.length;s++){
    var scene = scenes[s], n = s+1;
    var layoutPart = layouts[scene.layoutName] || layouts['Leer'] || layoutFiles[0];
    var rid = 'rId' + (maxRid + 1 + s);

    // Footer and slide-number placeholders must carry the idx of THIS layout,
    // otherwise PowerPoint cannot match them to the master and drops them.
    var lx = await zip.file(layoutPart).async('string');
    var phIdx = {};
    (lx.match(/<p:ph[^>]*\/>/g)||[]).forEach(function(tag){
      var ty = tag.match(/type="(ftr|sldNum)"/), ix = tag.match(/idx="(\d+)"/);
      if(ty) phIdx[ty[1]] = ix ? ix[1] : null;
    });
    scene.objs.forEach(function(o){
      if(o.placeholder==='ftr' || o.placeholder==='sldNum') o.phIdx = phIdx[o.placeholder];
    });
    scene._assetRel = logoRel;

    zip.file('ppt/slides/slide'+n+'.xml', buildSlideXml(scene));
    zip.file('ppt/slides/_rels/slide'+n+'.xml.rels',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../'
      + layoutPart.replace('ppt/','') + '"/>'
      + (logo ? '<Relationship Id="'+logoRel+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/'+logoName+'"/>' : '')
      + '</Relationships>');

    ctAdds.push('<Override PartName="/ppt/slides/slide'+n+'.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>');
    relAdds.push('<Relationship Id="'+rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide'+n+'.xml"/>');
    sldIds.push('<p:sldId id="'+(256+s)+'" r:id="'+rid+'"/>');
  }

  zip.file('[Content_Types].xml', ct.replace('</Types>', ctAdds.join('')+'</Types>'));
  zip.file('ppt/_rels/presentation.xml.rels', prels.replace('</Relationships>', relAdds.join('')+'</Relationships>'));

  var pres = await zip.file('ppt/presentation.xml').async('string');
  pres = pres.replace(/<p:sldIdLst>[\s\S]*?<\/p:sldIdLst>/, '<p:sldIdLst>'+sldIds.join('')+'</p:sldIdLst>');
  zip.file('ppt/presentation.xml', pres);

  // Media that only the removed sample slides referenced would otherwise stay
  // behind as orphans, which PowerPoint reports as a damaged file.
  var relFiles = Object.keys(zip.files).filter(function(p){ return /\.rels$/.test(p); });
  var referenced = {};
  for(var r=0;r<relFiles.length;r++){
    var rx = await zip.file(relFiles[r]).async('string');
    (rx.match(/Target="[^"]*media\/[^"]+"/g)||[]).forEach(function(t){
      referenced[t.replace(/.*media\//,'').replace(/"$/,'')] = true;
    });
  }
  Object.keys(zip.files).forEach(function(p){
    var m = p.match(/^ppt\/media\/(.+)$/);
    if(m && !referenced[m[1]]) zip.remove(p);
  });

  return zip;
}

<script>
(function(){
  "use strict";
  var E = window.StoryCraft, G = E.G;
  var THEME = E.DEFAULT_THEME;
  var masterData = null, masterLabel = '';
  var deck = DECK_CONTENT;
  var opts = { logo:null, footer:{left:'',middle:'',right:''}, slideNumbers:true };
  var active = 0, scenes = [], warns = [];

  function pct(v,total){ return (v/total*100).toFixed(3)+'%'; }
  function b64ToBytes(b64){
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
    return out;
  }
  function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  function sceneFor(i){
    return E.buildScene(deck[i].template, deck[i].content, THEME, opts, i, deck.length);
  }
  function titleOf(i){
    var c = deck[i].content;
    return c.title || c.eyebrow || E.TEMPLATES[deck[i].template].label;
  }

  // ---------- master ----------
  async function loadMaster(data, label){
    var zip = await JSZip.loadAsync(data);
    var tf = zip.file('ppt/theme/theme1.xml');
    if(!tf) throw new Error('Kein Theme im Paket');
    THEME = E.parseTheme(await tf.async('string'));
    masterData = data; masterLabel = label;
    document.body.style.setProperty('--font-slide','"'+(THEME.fonts.minor||'Segoe UI')+'","Segoe UI",Arial,sans-serif');
    document.getElementById('footNote').textContent =
      'Master: '+(THEME.name||label)+' · Schrift '+(THEME.fonts.minor||'—')
      +' · Inhalte liegen als DECK_CONTENT im Kopf dieser Datei und werden per Prompt gesetzt.';
    rebuild();
  }

  // ---------- render ----------
  function render(scene){
    var frame = document.getElementById('frame');
    frame.innerHTML = '';
    scene.objs.forEach(function(o){
      var d = document.createElement('div');
      d.className = 'obj' + (o.type==='icon' ? ' icon' : '') + (o.type==='image' ? ' img' : '');
      d.style.left = pct(o.x,G.W); d.style.top = pct(o.y,G.H);
      d.style.width = pct(o.w,G.W); d.style.height = pct(o.h,G.H);
      if(o.type==='box'){
        d.style.background = '#'+o.fill.hex;
        d.style.border = (o.lineW||0)+'px solid #'+((o.line||o.fill).hex);
        d.style.borderRadius = 'calc(var(--pxpi,60) * 1px * '+(o.radius||0)+')';
      } else if(o.type==='text'){
        d.dataset.check = 'overflow';
        d.style.fontSize = 'calc(var(--pxpi,60) * 1px * '+(o.fontSize/72)+')';
        d.style.fontWeight = o.bold ? '700' : '400';
        d.style.color = '#'+o.color.hex;
        d.style.lineHeight = String(o.leading||1.2);
        d.style.textAlign = o.align||'left';
        d.style.display='flex';
        d.style.alignItems = o.valign==='mid' ? 'center' : 'flex-start';
        d.style.justifyContent = o.align==='center' ? 'center' : (o.align==='right' ? 'flex-end' : 'flex-start');
        d.textContent = o.value||'';
      } else if(o.type==='icon'){
        d.innerHTML = E.svgFor(o.name, o.color.hex);
      } else if(o.type==='image' && opts.logo){
        var img = document.createElement('img'); img.src = opts.logo.url; img.alt='Logo';
        d.appendChild(img);
      }
      frame.appendChild(d);
    });
    if(document.getElementById('optGrid').checked) addGrid(frame);
    frame.style.setProperty('--pxpi', (frame.clientWidth/G.W).toFixed(3));
  }
  function addGrid(frame){
    var ov = document.createElement('div');
    ov.style.cssText='position:absolute;inset:0;pointer-events:none';
    var safe = document.createElement('div');
    safe.style.cssText='position:absolute;border:1.5px dashed rgba(20,22,26,.4)';
    safe.style.left=pct(G.SAFE.left,G.W); safe.style.top=pct(G.SAFE.top,G.H);
    safe.style.right=pct(G.W-G.SAFE.right,G.W); safe.style.bottom=pct(G.H-G.SAFE.bottom,G.H);
    ov.appendChild(safe);
    for(var c=0;c<G.COLS;c++){
      var col=document.createElement('div');
      col.style.cssText='position:absolute;top:0;bottom:0;background:rgba(226,0,116,.05);border-left:1px dashed rgba(120,120,130,.3);border-right:1px dashed rgba(120,120,130,.3)';
      col.style.left=pct(E.colX(c),G.W); col.style.width=pct(G.COLW,G.W);
      ov.appendChild(col);
    }
    frame.appendChild(ov);
  }

  // ---------- gate ----------
  function paintGate(rows){
    document.getElementById('qaList').innerHTML = rows.map(function(r){
      var k = r.status==='pass' ? 'pass' : 'warn';
      var l = r.status==='pass' ? 'PASS' : (r.status==='pending' ? '…' : 'WARN');
      return '<div class="qa-row"'+(r.id?' data-row-id="'+r.id+'"':'')+'>'
        +'<span class="qa-badge '+k+'">'+l+'</span>'
        +'<span class="qa-text"><b>'+r.title+'</b><span>'+r.detail+'</span></span></div>';
    }).join('');
  }
  function refreshStatus(){
    var n = warns.filter(Boolean).length;
    var chip = document.getElementById('gateChip');
    chip.classList.toggle('warn', n>0);
    document.getElementById('gateText').textContent = n>0
      ? n+' von '+deck.length+' Folien prüfen'
      : 'Alle '+deck.length+' Folien geprüft';
    document.getElementById('exportBtn').disabled = (n>0 || !masterData);
    if(!masterData) document.getElementById('gateText').textContent = 'Kein Master geladen';
    Array.prototype.forEach.call(document.querySelectorAll('#nav .f'), function(f,i){
      f.classList.toggle('warn', !!warns[i]);
    });
  }
  function checkOverflow(){
    requestAnimationFrame(function(){
      setTimeout(function(){
        var clipped = Array.prototype.filter.call(
          document.querySelectorAll('#frame [data-check="overflow"]'), function(e){
            return e.scrollHeight>e.clientHeight+2 || e.scrollWidth>e.clientWidth+2;
          });
        var row = document.querySelector('[data-row-id="overflow"]');
        if(row){
          var b = row.querySelector('.qa-badge'), t = row.querySelector('.qa-text');
          if(clipped.length){
            b.className='qa-badge warn'; b.textContent='WARN';
            t.innerHTML='<b>Text-Overflow</b><span>'+clipped.length+' Textbox(en) abgeschnitten.</span>';
            warns[active]=true;
          } else {
            b.className='qa-badge pass'; b.textContent='PASS';
            t.innerHTML='<b>Text-Overflow</b><span>Keine abgeschnittenen Texte.</span>';
          }
        }
        refreshStatus();
      }, 110);
    });
  }

  // ---------- deck ----------
  function buildNav(){
    var nav = document.getElementById('nav');
    nav.innerHTML='';
    deck.forEach(function(d,i){
      var b = document.createElement('button');
      b.innerHTML = '<span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="t"></span><span class="f"></span>';
      b.querySelector('.t').textContent = titleOf(i);
      b.addEventListener('click', function(){ show(i); });
      nav.appendChild(b);
    });
  }
  function rebuild(){
    scenes = deck.map(function(_,i){ return sceneFor(i); });
    warns = scenes.map(function(s){ return E.computeGate(s).some(function(r){ return r.status==='warn'; }); });
    show(active);
  }
  function show(i){
    active = Math.max(0, Math.min(deck.length-1, i));
    Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b,idx){
      b.classList.toggle('active', idx===active);
    });
    var scene = scenes[active] = sceneFor(active);
    render(scene);
    var rows = E.computeGate(scene);
    warns[active] = rows.some(function(r){ return r.status==='warn'; });
    rows.push({status:'pending', title:'Text-Overflow', detail:'Wird geprüft…', id:'overflow'});
    paintGate(rows);
    refreshStatus();
    checkOverflow();
    document.getElementById('stageNote').textContent = 'Folie '+(active+1)+' von '+deck.length;
    document.getElementById('deckSub').textContent =
      deck.length+' Folien · '+(THEME.name||masterLabel||'Master')+' · Export 1:1 aus dieser Ansicht';
  }

  // ---------- export ----------
  var downloadsNS = null;
  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(function(ns){ downloadsNS=ns; }).catch(function(){ downloadsNS=null; });
  }
  async function deliver(blob, filename, el){
    if(downloadsNS){
      try{
        var r = await downloadsNS.save({filename:filename, data:blob});
        el.textContent = r.status==='saved' ? 'Gespeichert' : 'Übergeben';
      }catch(err){
        el.textContent = (err && err.code==='declined') ? 'Abgebrochen' : 'Speichern fehlgeschlagen';
      }
      return;
    }
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    el.textContent = 'Datei erzeugt';
  }
  document.getElementById('exportBtn').addEventListener('click', async function(){
    var el = document.getElementById('exportStatus');
    if(!masterData){ el.textContent='Kein Master'; return; }
    el.textContent = 'Schreibe in den Master…';
    try{
      var list = deck.map(function(_,i){ return sceneFor(i); });
      var zip = await E.injectIntoMaster(JSZip, masterData, list,
        opts.logo ? { bytes:opts.logo.bytes, ext:opts.logo.ext } : null);
      var blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE',
        mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
      await deliver(blob, 'StoryCraft_Deck.pptx', el);
    }catch(err){
      el.textContent = 'Export fehlgeschlagen: '+(err && err.message ? err.message : err);
    }
  });

  // ---------- settings ----------
  function applyLogo(dataUrl, bytes, ext, w, h, persist){
    opts.logo = { url:dataUrl, bytes:bytes, ext:ext, w:w, h:h };
    var prev = document.getElementById('logoPrev');
    prev.innerHTML = '';
    var img = document.createElement('img'); img.src = dataUrl; img.alt='Logo';
    prev.appendChild(img);
    if(persist) store('sc.logo', JSON.stringify({d:dataUrl, e:ext, w:w, h:h}));
    rebuild();
  }
  function dataUrlToBytes(d){
    var b = atob(d.split(',')[1]), out = new Uint8Array(b.length);
    for(var i=0;i<b.length;i++) out[i]=b.charCodeAt(i);
    return out;
  }
  document.getElementById('logoFile').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var ext = /jpe?g$/i.test(f.name) || f.type==='image/jpeg' ? 'jpeg' : 'png';
    var r = new FileReader();
    r.onload = function(){
      var dataUrl = r.result;
      var im = new Image();
      im.onload = function(){ applyLogo(dataUrl, dataUrlToBytes(dataUrl), ext, im.naturalWidth, im.naturalHeight, true); };
      im.src = dataUrl;
    };
    r.readAsDataURL(f);
  });
  document.getElementById('logoClear').addEventListener('click', function(){
    opts.logo = null;
    document.getElementById('logoPrev').innerHTML = '<span>Kein Logo</span>';
    try{ localStorage.removeItem('sc.logo'); }catch(e){}
    rebuild();
  });
  ['fLeft','fMid','fRight'].forEach(function(id,i){
    var key = ['left','middle','right'][i];
    document.getElementById(id).addEventListener('input', function(e){
      opts.footer[key] = e.target.value;
      store('sc.footer', JSON.stringify(opts.footer));
      rebuild();
    });
  });
  document.getElementById('optNum').addEventListener('change', function(e){
    opts.slideNumbers = e.target.checked;
    store('sc.num', e.target.checked ? '1' : '0');
    rebuild();
  });
  document.getElementById('optGrid').addEventListener('change', function(){ show(active); });
  document.getElementById('masterFile').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      loadMaster(new Uint8Array(r.result), f.name).catch(function(err){
        document.getElementById('footNote').textContent = 'Master nicht lesbar: '+(err && err.message ? err.message : err);
      });
    };
    r.readAsArrayBuffer(f);
  });
  document.getElementById('gateChip').addEventListener('click', function(){
    var p = document.getElementById('qaPanel');
    p.hidden = !p.hidden;
    this.setAttribute('aria-expanded', String(!p.hidden));
  });
  document.getElementById('prevBtn').addEventListener('click', function(){ show(active-1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ show(active+1); });
  document.addEventListener('keydown', function(e){
    if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if(e.key==='ArrowRight') show(active+1);
    if(e.key==='ArrowLeft') show(active-1);
  });
  window.addEventListener('resize', function(){
    var f = document.getElementById('frame');
    f.style.setProperty('--pxpi', (f.clientWidth/G.W).toFixed(3));
  });

  // ---------- init ----------
  function restore(){
    var f = load('sc.footer');
    if(f){ try{
      opts.footer = JSON.parse(f);
      document.getElementById('fLeft').value = opts.footer.left||'';
      document.getElementById('fMid').value = opts.footer.middle||'';
      document.getElementById('fRight').value = opts.footer.right||'';
    }catch(e){} }
    var n = load('sc.num');
    if(n!==null){ opts.slideNumbers = n==='1'; document.getElementById('optNum').checked = opts.slideNumbers; }
    var l = load('sc.logo');
    if(l){ try{
      var o = JSON.parse(l);
      opts.logo = { url:o.d, bytes:dataUrlToBytes(o.d), ext:o.e, w:o.w, h:o.h };
      var prev = document.getElementById('logoPrev'); prev.innerHTML='';
      var img = document.createElement('img'); img.src=o.d; img.alt='Logo'; prev.appendChild(img);
    }catch(e){} }
  }
  function init(){
    restore();
    buildNav();
    rebuild();
    if(MASTER_B64 && MASTER_B64.length>100){
      loadMaster(b64ToBytes(MASTER_B64), 'Eingebetteter Master').catch(function(err){
        document.getElementById('footNote').textContent = 'Eingebetteter Master nicht lesbar: '+(err && err.message ? err.message : err);
        refreshStatus();
      });
    } else {
      document.getElementById('footNote').textContent = 'Kein Master eingebettet — bitte über „Anderen Master laden" wählen.';
      refreshStatus();
    }
  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(init); else init();
})();
</script>
